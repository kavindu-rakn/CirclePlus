name: "Implementation task"
description: "One bounded issue/PR within the approved roadmap."
body:
  - type: markdown
    attributes:
      value: "Keep repo progress data authoritative; GitHub tracking is an optional mirror."
  - type: textarea
    id: phase
    attributes:
      label: "Phase / version / area"
      description: "Include the portable progress task ID."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope and non-goals"
      description: "What will this PR deliver? What is excluded?"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "List observable outcomes and relevant phase gates."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Task IDs, issues/PRs, evidence/approval gates."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Historical evidence links and confidence"
      description: "Evidence IDs/URLs/date/platform; high, medium, low, or unknown. State gaps."
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: "Recommended model / effort"
      description: "Default GPT-6.1 Sol / Medium; explain any escalation. Verify runtime separately."
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: "Security / privacy impact"
      description: "Audience visibility, authorization, uploads, moderation, data; or no impact with reason."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: "Expected tests"
      description: "Relevant domain/negative/E2E/visual checks; justify not applicable."
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: "Teaching scope"
      description: "Concepts the developer should understand before merge."
    validations:
      required: true
