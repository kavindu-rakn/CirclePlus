name: Check project status
on:
  pull_request:
    paths:
      - 'project/**'
      - 'STATUS.md'
      - 'scripts/generate-status*'
      - '.github/workflows/update-status.yml'
  push:
    paths:
      - 'project/**'
      - 'STATUS.md'
      - 'scripts/generate-status*'
      - '.github/workflows/update-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test progress validation and deterministic output
        run: node --test scripts/generate-status.test.mjs
      - name: Verify dashboard freshness
        run: node scripts/generate-status.mjs --check
